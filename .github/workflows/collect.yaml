name: Collect

on:
  schedule:
    # 每 3 小时运行一次，保证节点新鲜
    - cron: "0 */2 * * *"
  workflow_dispatch:

# 并发规则：防止任务互相打架
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # 时区设置
  TZ: Asia/Shanghai

  # 核心变量
  GIST_PAT: ${{ secrets.GIST_PAT }}
  GIST_LINK: ${{ secrets.GIST_LINK }}

  # 自定义变量 (保留你原有的设置)
  CUSTOMIZE_LINK: ${{ secrets.CUSTOMIZE_LINK }}
  ENABLE_SPECIAL_PROTOCOLS: ${{ vars.ENABLE_SPECIAL_PROTOCOLS }}

jobs:
  process:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Prepare
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          architecture: "x64"
          cache: "pip"

      - name: Install
        run: pip3 install -r requirements.txt

      - name: Check
        run: |
          if [ -z "$GIST_PAT" ]; then
              echo "Error: environment 'GIST_PAT' cannot be empty"
              exit 1
          fi

          if [ -z "$GIST_LINK" ]; then
              echo "Error: environment 'GIST_LINK' cannot be empty"
              exit 1
          fi

          LINK_PARTS=$(echo "$GIST_LINK" | awk -F'/' 'NF==2 && $1!="" && $2!=""')
          if [ -z "$LINK_PARTS" ]; then
              echo "Error: environment 'GIST_LINK' is not valid, should be 'username/gist_id' format"
              exit 1
          fi

      # 🔴 关键修改：删除了 --skip 参数
      # --all: 抓取所有源
      # --overwrite: 覆盖旧数据
      # (去掉了 --skip): 开启测速验证！只有活的节点才会被保存！
      - name: Collect
        run: python -u subscribe/collect.py --all --overwrite

      - name: Timestamp
        run: date
